name: cybercafe_pos
description: "Shivam Cyber Cafe - Offline-first POS for Cyber Cafe + Stationery shops"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Database (mobile + desktop)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # IDs / formatting
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3

  # Images
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # PDF / printing / sharing
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^12.0.2

  # Charts
  fl_chart: ^0.68.0

  # Barcode scanning (Android camera)
  mobile_scanner: ^5.2.3

  # Permissions
  permission_handler: ^11.3.1

  # Backup archive handling
  archive: ^3.6.1

  # Cloud sync / cross-device backup
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
