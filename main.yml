name: Build Shivam Cyber Cafe

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # WINDOWS EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Create assets folders
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "assets\images" | Out-Null

      - name: Ensure Windows project
        shell: powershell
        run: |
          if (!(Test-Path "windows\CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "Shivam-Cyber-Cafe-Windows.zip" `
            -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Shivam-Cyber-Cafe-Windows
          path: Shivam-Cyber-Cafe-Windows.zip


  # ==========================================
  # ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Enable Android
        run: flutter config --enable-android

      # IMPORTANT:
      # Always ensure the Android platform exists.
      - name: Generate Android project
        run: |
          echo "Checking Android project..."

          if [ ! -d "android" ]; then
            echo "Android folder missing. Creating it..."
            flutter create --platforms=android .
          else
            echo "Android folder exists. Regenerating missing Android files..."
            flutter create --platforms=android .
          fi

      - name: Verify Android files
        run: |
          echo "===== ANDROID DIRECTORY ====="
          ls -la android
          echo "===== ANDROID APP DIRECTORY ====="
          ls -la android/app

          if [ -f "android/app/build.gradle" ]; then
            echo "Found android/app/build.gradle"
          elif [ -f "android/app/build.gradle.kts" ]; then
            echo "Found android/app/build.gradle.kts"
          else
            echo "ERROR: Android build file was not generated."
            exit 1
          fi

      - name: Create assets folders
        run: |
          mkdir -p assets/images

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Shivam-Cyber-Cafe.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Shivam-Cyber-Cafe-Android
          path: release/Shivam-Cyber-Cafe.apk
