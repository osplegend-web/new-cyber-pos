name: Build Shivam Cyber Cafe

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================
  # WINDOWS EXE
  # =========================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Create missing assets directory
        shell: powershell
        run: |
          if (!(Test-Path "assets\images")) {
            New-Item -ItemType Directory -Force -Path "assets\images" | Out-Null
          }

      - name: Generate Windows project if missing
        shell: powershell
        run: |
          if (!(Test-Path "windows\CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows application
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "Shivam-Cyber-Cafe-Windows.zip" `
            -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Shivam-Cyber-Cafe-Windows
          path: Shivam-Cyber-Cafe-Windows.zip


  # =========================
  # ANDROID APK
  # =========================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Enable Android
        run: flutter config --enable-android

      - name: Create missing Android project
        shell: bash
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android project missing. Generating Android platform..."
            flutter create --platforms=android .
          else
            echo "Android project already exists."
          fi

      - name: Create assets directory
        run: |
          mkdir -p assets/images

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Verify Android project
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Android project found successfully."

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/Shivam-Cyber-Cafe.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Shivam-Cyber-Cafe-Android
          path: release/Shivam-Cyber-Cafe.apk
